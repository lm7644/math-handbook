<!DOCTYPE html>
<html lang="zh-CN" data-theme="minimal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型数学 · 极简工具书（速查手册）</title>
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F7F7F7; --ink:#111111; --ink-2:#3C3C3C;
  --muted:#6E6E6E; --line:#E9E9E9; --line-strong:#CFCFCF; --accent:#0A0A0A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
section,[id^="g"]{scroll-margin-top:96px}
/* 顶栏：标题 + 检索 */
.topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.topbar-in{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:15px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.topbar .badge{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);padding:6px 12px;background:var(--paper-2)}
.searchbox svg{width:14px;height:14px;color:var(--muted);flex:none}
.searchbox input{border:none;outline:none;background:transparent;font:inherit;font-size:13px;width:100%;color:var(--ink)}
.count{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
/* 字母/组导航 */
.groupnav{max-width:980px;margin:0 auto;padding:8px 20px;display:flex;flex-wrap:wrap;gap:2px 4px;border-bottom:1px solid var(--line)}
.groupnav a{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);padding:3px 8px;border:1px solid transparent;white-space:nowrap}
.groupnav a:hover{border-color:var(--ink)}
.groupnav a.cur{background:var(--ink);color:var(--paper)}
/* 条目 */
.wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}
.ghead{margin:36px 0 4px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);display:flex;align-items:baseline;gap:12px;position:relative}
.ghead .gn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em}
.ghead h2{font-size:17px;font-weight:800}
.ghead .gsub{font-size:11px;color:var(--muted);margin-left:auto}
/* 竖排抽屉标签：左缘档案索引 */
.gtab{display:none}
@media(min-width:1120px){
  .wrap{position:relative}
  .gtab{display:block;position:absolute;left:-40px;top:4px;writing-mode:vertical-rl;
    font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.3em;
    background:var(--ink);color:var(--paper);padding:14px 4px;border-radius:0 2px 2px 0;
    print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
.entry{display:grid;grid-template-columns:200px minmax(0,1fr) 40px;gap:6px 20px;padding:11px 8px 11px 12px;border-bottom:1px solid var(--line);border-left:2px solid transparent;transition:background .15s,border-color .15s}
.entry:hover{background:var(--paper-2);border-left-color:var(--ink)}
.entry.hide{display:none}
.e-name{font-weight:700;font-size:14px;line-height:1.4}
.e-name .en{display:block;font-weight:400;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.e-body{min-width:0}
.e-formula{overflow-x:auto;padding:2px 0}
.e-note{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.e-note b{color:var(--ink)}
.e-tag{display:inline-block;font-family:var(--mono);font-size:9px;color:var(--ink-2);border:1px dashed var(--line-strong);padding:1px 5px;margin-top:3px;letter-spacing:.08em;justify-self:end;text-align:center;min-width:30px;height:fit-content;background:var(--paper-2)}
/* 对照表区块 */
.tbl-block{margin:10px 0 0}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-family:var(--mono);font-size:10px;color:var(--ink-2);text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--ink);font-weight:600;letter-spacing:.04em}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
/* MathJax */
mjx-container[jax="SVG"]{font-size:103%}
mjx-container[jax="SVG"][display="true"]{margin:8px 0 !important;text-align:left !important}
.footer{max-width:980px;margin:0 auto;padding:20px;border-top:1.5px solid var(--ink);font-family:var(--mono);font-size:10px;color:var(--muted);line-height:2;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 30px}
@media(max-width:680px){
  .entry{grid-template-columns:1fr 40px}
  .entry .e-name{grid-column:1/-1}
  .groupnav{flex-wrap:nowrap;overflow-x:auto;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent 99%);mask-image:linear-gradient(90deg,#000 88%,transparent 99%)}
  .topbar .badge{display:none}
  .topbar-in{padding:8px 14px;gap:8px;flex-wrap:wrap}
  .searchbox{flex-basis:100%;order:3}
}
@media print{
  .topbar,.groupnav{display:none}
  /* 打印件保留档案标签：竖排改横排小标签 */
  .gtab{display:inline-block;position:static;writing-mode:horizontal-tb;
    background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:8.5px;font-weight:700;
    letter-spacing:.15em;padding:2px 8px;border-radius:2px;margin-right:8px;
    print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .ghead .gn{display:none}
  body{font-size:9pt}
  .entry{break-inside:avoid}
  .ghead{break-after:avoid;break-inside:avoid}
  @page{size:A4;margin:1.5cm;@bottom-center{content:counter(page);font-family:Menlo,monospace;font-size:8pt;color:#666}@top-center{content:"大模型数学 · 极简工具书";font-family:Menlo,monospace;font-size:8pt;color:#999;letter-spacing:.1em}}
}
</style>
</head>

var wrap=document.getElementById('wrap'), gnav=document.getElementById('groupnav');
var groups={};
DATA.forEach(function(e){ (groups[e.g]=groups[e.g]||[]).push(e); });
var order=["符号","线性代数","微积分与求导","概率与采样","信息论与损失","优化器与调度","Transformer 组件","数值稳定","训练估算","部署推理","RL 与对齐","检索 RAG","对照表"];
var html='', nav='';
order.forEach(function(g){
  if(!groups[g])return;
  var gid='g-'+g.replace(/[^A-Za-z0-9一-龥]/g,'');
  nav+='<a href="#'+gid+'">'+g+'</a>';
  html+='<div class="ghead" id="'+gid+'"><span class="gtab">'+g+'</span><span class="gn">'+g+'</span><h2></h2><span class="gsub">'+groups[g].length+' 条</span></div>';
  groups[g].forEach(function(e){
    html+='<div class="entry" data-k="'+ (e.t+' '+(e.en||'')+' '+e.n).toLowerCase().replace(/"/g,'') +'">'
      +'<div class="e-name">'+e.t+(e.en?'<span class="en">'+e.en+'</span>':'')+'</div>'
      +'<div class="e-body">'
      +(e.f?'<div class="e-formula">\\['+e.f+'\\]</div>':'')
      +(e.n?'<div class="e-note">'+e.n+'</div>':'')
      +'</div>'
      +(e.tag?'<span class="e-tag">§'+e.tag+'</span>':'<span></span>')

  var q=this.value.trim().toLowerCase();
  document.querySelectorAll('.entry').forEach(function(e){
    e.classList.toggle('hide', q && e.getAttribute('data-k').indexOf(q)===-1);
  }); refresh();
});
